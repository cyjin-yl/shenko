[package]
name = "shenko"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "shenko"
path = "src/main.rs"

[dependencies]
cordis-core.workspace = true
shenko-identity = { path = "../../crates/shenko-identity" }
shenko-types = { path = "../../crates/shenko-types" }
shenko-kernel = { path = "../../crates/shenko-kernel" }
shenko-store = { path = "../../crates/shenko-store" }
shenko-node = { path = "../../crates/shenko-node" }
shenko-exec-host = { path = "../../crates/shenko-exec-host" }
shenko-broker = { path = "../../crates/shenko-broker" }
shenko-subject = { path = "../../crates/shenko-subject" }
shenko-quota = { path = "../../crates/shenko-quota" }
shenko-awareness-core = { path = "../../crates/shenko-awareness-core" }
shenko-context-policy = { path = "../../crates/shenko-context-policy", features = ["store"] }
shenko-compact-budget = { path = "../../crates/shenko-compact-budget" }
shenko-compact-snap = { path = "../../crates/shenko-compact-snap" }
shenko-memory = { path = "../../crates/shenko-memory" }
shenko-ui = { path = "../../crates/shenko-ui" }
shenko-seed = { path = "../../crates/shenko-seed" }
shenko-wasm = { path = "../../crates/shenko-wasm" }
shenko-channel-napcat = { path = "../../crates/shenko-channel-napcat" }
base64 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
uuid = { workspace = true }
chrono = { workspace = true }
dirs-next = "2"
libc = "0.2"

[dev-dependencies]
x11rb = { workspace = true }

[lints.rust]
edition_2024_expr_fragment_specifier = "allow"
