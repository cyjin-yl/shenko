[package]
name = "shenko"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "shenko"
path = "src/main.rs"

[lib]
name = "shenko"
path = "src/lib.rs"

[features]
default = ["compat-mcp", "compat-skill"]
compat-mcp = ["dep:shenko-compat-mcp"]
compat-skill = ["dep:shenko-compat-skill", "dep:cap-std", "dep:cap-fs-ext"]

[dependencies]
async-trait = { workspace = true }
cordis-core.workspace = true
shenko-mobile = { path = "../../crates/shenko-mobile" }
shenko-identity = { path = "../../crates/shenko-identity" }
shenko-types = { path = "../../crates/shenko-types" }
shenko-kernel = { path = "../../crates/shenko-kernel" }
shenko-store = { path = "../../crates/shenko-store" }
shenko-node = { path = "../../crates/shenko-node" }
shenko-exec-host = { path = "../../crates/shenko-exec-host" }
shenko-repl = { path = "../../crates/shenko-repl" }
shenko-exec-ssh = { path = "../../crates/shenko-exec-ssh" }
shenko-broker = { path = "../../crates/shenko-broker" }
shenko-subject = { path = "../../crates/shenko-subject" }
shenko-quota = { path = "../../crates/shenko-quota" }
shenko-awareness-core = { path = "../../crates/shenko-awareness-core" }
shenko-compat = { path = "../../crates/shenko-compat" }
shenko-compat-mcp = { path = "../../crates/shenko-compat-mcp", optional = true }
shenko-compat-skill = { path = "../../crates/shenko-compat-skill", optional = true }
cap-std = { version = "3.4.6", optional = true }
cap-fs-ext = { version = "3.4.6", optional = true }
shenko-context-policy = { path = "../../crates/shenko-context-policy", features = ["store"] }
shenko-compact-budget = { path = "../../crates/shenko-compact-budget" }
shenko-compact-snap = { path = "../../crates/shenko-compact-snap" }
shenko-compact-rollover = { path = "../../crates/shenko-compact-rollover" }
shenko-memory = { path = "../../crates/shenko-memory" }
shenko-ui = { path = "../../crates/shenko-ui" }
shenko-seed = { path = "../../crates/shenko-seed" }
shenko-update = { path = "../../crates/shenko-update" }
shenko-wasm = { path = "../../crates/shenko-wasm" }
shenko-channel-napcat = { path = "../../crates/shenko-channel-napcat" }
shenko-media = { path = "../../crates/shenko-media" }
base64 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
dirs-next = "2"
libc = "0.2"

[dev-dependencies]
russh = { workspace = true }
async-trait = { workspace = true }
x11rb = { workspace = true }

[lints.rust]
edition_2024_expr_fragment_specifier = "allow"
