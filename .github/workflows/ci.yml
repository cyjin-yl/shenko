name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base-sha:
        description: Full independently reviewed ancestor SHA for the ratchets
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

# These six literal job names are the required-check contract. Every PR runs
# every job; changed paths, draft state and local evidence never bypass them.
# Builds run in development containers with read-only GitHub permissions and
# no lab/production credentials. Branch/ruleset enforcement is configured only
# after these real checks succeed, by the repository owner.
jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    container: rust:1.98.1-bookworm
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/target/rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Checkout writes safe.directory under a temporary HOME. After each
      # checkout, register only the runtime workspace in the restored shell
      # HOME so subsequent Git calls can read the host-owned checkout.
      - name: Trust the checked-out workspace in the container shell
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install native build prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3 cmake clang libclang-dev pkg-config libssl-dev openssh-server curl ca-certificates tmux
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> .ci/target/rust
          shared-key: rust-1.98.1-workspace
      - name: Check every workspace target with the lockfile
        run: |
          mkdir -p .ci/evidence
          cargo check --workspace --all-targets --features shenko/compat-poppy --locked -j2 2>&1 | tee .ci/evidence/workspace-check.log
      - name: Build the pinned SSH WASI guest
        run: |
          rustup target add wasm32-wasip1 --toolchain 1.98.1
          mkdir -p .ci/toolchains
          curl --fail --location --retry 2 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
            --output .ci/toolchains/wasi-sdk.tar.gz
          echo 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  .ci/toolchains/wasi-sdk.tar.gz' | sha256sum --check --strict
          tar -xzf .ci/toolchains/wasi-sdk.tar.gz -C .ci/toolchains
          python3 crates/shenko-wasm/ports/ssh-wasi/build.py \
            --sdk .ci/toolchains/wasi-sdk-34.0-x86_64-linux \
            --target-dir .ci/target/ssh-wasi \
            --output-dir .ci/evidence/ssh-wasi/build
      - uses: ./.github/actions/native-fixtures
      - name: Test the workspace, including real SSH, integration tests and doctests
        # Retain every failing target in one run; pipefail keeps any failure.
        run: |
          cargo test --workspace --features shenko/compat-poppy --locked --no-fail-fast -j2 2>&1 | tee .ci/evidence/workspace-test.log
      - name: Retain the DSH receipt as a small standalone artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-native-evidence
          path: .ci/evidence/dsh/native-journey.json
          if-no-files-found: ignore
      - name: Retain native fixture receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-evidence
          path: .ci/evidence
          if-no-files-found: ignore

  clippy-ratchet:
    name: clippy-ratchet
    runs-on: ubuntu-24.04
    container: rust:1.98.1-bookworm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out workspace in the container shell
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the same compiler and native prerequisites for both trees
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3 cmake clang libclang-dev pkg-config libssl-dev
          rustup component add clippy --toolchain 1.98.1
      - name: Resolve the independent event baseline
        id: base
        run: python3 scripts/ci/base_ref.py
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            .ci/target/clippy
          key: clippy-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-${{ runner.arch }}-1.98.1-
      - name: Compare real production and all-target Clippy diagnostics
        run: python3 scripts/ci/clippy_ratchet.py --base '${{ steps.base.outputs.sha }}'
      - name: Retain both diagnostic streams and the exact baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-ratchet-evidence
          path: |
            .ci/evidence/base.json
            .ci/evidence/clippy/*.json
            .ci/evidence/clippy/*.jsonl
            .ci/evidence/clippy/*.log
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-24.04
    container: python:3.13.9-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out workspace in the container shell
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the reference checker's declared parser dependencies
        run: |
          python3 -m venv .ci/python
          if [[ -f scripts/requirements-ci.txt ]]; then
            .ci/python/bin/python -m pip install --requirement scripts/requirements-ci.txt
          fi
      - name: Validate current documents, anchors, cases and symbols
        run: .ci/python/bin/python scripts/check_docs.py
      - name: Run C19 recorder integrity and real-process concurrency cases
        run: .ci/python/bin/python -I scripts/observe_longrun_test.py
      - name: Check real-journey evidence and request-timing accounting
        # Driver mechanics only: these checks never contact a model service.
        run: |
          .ci/python/bin/python -I scripts/real_single_node_journey_test.py
          .ci/python/bin/python -I scripts/summarize_request_timing_test.py

  docs-migration:
    name: docs-migration
    runs-on: ubuntu-24.04
    container: python:3.13.9-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out workspace in the container shell
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the reference checker's declared parser dependencies
        run: |
          python3 -m venv .ci/python
          if [[ -f scripts/requirements-ci.txt ]]; then
            .ci/python/bin/python -m pip install --requirement scripts/requirements-ci.txt
          fi
      # This is conservation of original normative blocks. It is a separate
      # gate from current references and must permit valid appended obligations.
      - name: Verify original migration conservation
        run: .ci/python/bin/python scripts/check_docs.py --verify-migration

  kernel-boundary:
    name: kernel-boundary
    runs-on: ubuntu-24.04
    container: rust:1.98.1-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checked-out workspace in the container shell
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the structure checker's interpreter
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3
      - name: Resolve the independent event baseline
        id: base
        run: python3 scripts/ci/base_ref.py
      - name: Check the kernel boundary against that immutable commit
        run: python3 scripts/check_kernel_boundary.py --baseline-ref '${{ steps.base.outputs.sha }}'
      - name: Retain the independent boundary baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-boundary-evidence
          path: .ci/evidence/base.json
          if-no-files-found: error

  web:
    name: web
    runs-on: ubuntu-24.04
    container: node:24.22.1-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace in the container shell
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the independent rebuild driver prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3
      - name: Preserve committed bytes and check out the exact upstream pin
        run: python3 scripts/ci/web_assets.py prepare
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: crates/shenko-ui/web/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            crates/shenko-ui/web/pnpm-lock.yaml
            .ci/web/proto-ui/pnpm-lock.yaml
      - name: Verify the optional DSH tool bridge with its pinned runtime
        run: |
          mkdir -p .ci/dsh
          npm ci --ignore-scripts --no-audit --no-fund --prefix adapters/dsh
          npm test --prefix adapters/dsh 2>&1 | tee .ci/dsh/test.log
      - name: Build the real public closure, typecheck, test and independently rebuild
        run: python3 scripts/ci/web_assets.py check
      - name: Retain expected and rebuilt bytes, sources, provenance and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-rebuild-evidence
          path: |
            .ci/web/*.json
            .ci/web/*.log
            .ci/web/committed
            .ci/web/source/src/static
            .ci/web/source/web/generated
            .ci/dsh/test.log
          if-no-files-found: error

  reading-03b80-evidence:
    name: reading-03b80-evidence
    # One manually selected evidence ref, using the already registered CI
    # workflow. The six required jobs above retain their original execution.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/evidence/shenko-reading-03b80-20261122' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Obtain this run's fixed verification code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: reading-tools
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Check out the actual reviewed application
        uses: actions/checkout@v4
        with:
          ref: 03b80d770357fb8e7694c0fdac7a2c79911e970c
          path: reading-app
          persist-credentials: false
      - name: Check the normal runner browser and install the declared CJK font
        run: |
          test "$(id -u)" -ne 0
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          python3 --version
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: reading-app/crates/shenko-ui/web/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Exercise the fixed source and receipt negative controls
        run: |
          mkdir -p reading-evidence
          python3 -I reading-tools/scripts/ci/reading_evidence_test.py -v 2>&1 | tee reading-evidence/negative-controls.log
      - name: Guard the actual candidate before its independent rebuild
        run: python3 -I reading-tools/scripts/ci/reading_evidence.py before
      - name: Prepare the exact existing clean frontend rebuild
        working-directory: reading-app
        run: python3 scripts/ci/web_assets.py prepare 2>&1 | tee "$GITHUB_WORKSPACE/reading-evidence/prepare.log"
      - name: Rebuild and compare the complete original public frontend closure
        working-directory: reading-app
        run: python3 scripts/ci/web_assets.py check 2>&1 | tee "$GITHUB_WORKSPACE/reading-evidence/rebuild.log"
      - name: Guard clean bytes and installed tools immediately before reading
        id: reading_gate
        run: python3 -I reading-tools/scripts/ci/reading_evidence.py ready
      - name: Run the unchanged actual production reading journey
        working-directory: reading-app
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/reading-app/.ci/web/proto-ui/apps/www/node_modules/playwright-core/index.mjs
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
          READING_EVIDENCE_DIR: ${{ github.workspace }}/reading-evidence/journey
        # Keep the reviewed producer and its launch defaults byte-for-byte.
        # No wrapper, extra browser arguments, or sandbox-status claim.
        run: node scripts/web_reading_journey.mjs 2>&1 | tee "$GITHUB_WORKSPACE/reading-evidence/reading.log"
      - name: Guard final sources and verify all four bound journey receipts
        if: ${{ always() && steps.reading_gate.outcome == 'success' }}
        run: python3 -I reading-tools/scripts/ci/reading_evidence.py verify
      - name: Retain this run's real sources, rebuild, screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shenko-reading-03b80-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reading-evidence
            reading-app/scripts/web_reading_journey.mjs
            reading-app/crates/shenko-ui/src/static/build-manifest.json
            reading-app/.ci/web/*.json
            reading-app/.ci/web/*.log
            reading-app/.ci/web/committed
            reading-app/.ci/web/source/src/static
          if-no-files-found: error
