\* TLC configuration: capacity-pressure safety check.
\*
\* Bounded: 3 contexts, 2 requests, 2 identity tags, capacity 2, max 2 readers.
\* Three contexts competing for 2 units exercises the reclaim/eviction path
\* and the capacity refusal path. Unknown reads block eviction of the third
\* context even when capacity pressure demands it.
CONSTANTS
    Contexts = {"c1", "c2", "c3"}
    Requests = {"r1", "r2"}
    Identities = {"id1", "id2"}
    Capacity = 2
    MaxReaders = 2

INIT Init
NEXT Next

INVARIANTS
    PoolNeverOverCommits
    IdentityInvalidationComplete
