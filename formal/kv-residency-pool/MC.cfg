\* TLC configuration: basic KV residency pool safety check.
\*
\* Bounded: 2 contexts, 2 requests, 2 identity tags, capacity 2, max 2 readers.
\* This covers: single-context and two-context contention, identity change
\* with one matching and one stale lease, and two concurrent unknown reads.
CONSTANTS
    Contexts = {"c1", "c2"}
    Requests = {"r1", "r2"}
    Identities = {"id1", "id2"}
    Capacity = 2
    MaxReaders = 2

INIT Init
NEXT Next

INVARIANTS
    PoolNeverOverCommits
    IdentityInvalidationComplete
