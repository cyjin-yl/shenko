[workspace]
resolver = "2"
edition = "2024"

members = [
    "crates/shenko-types",
    "crates/shenko-kernel",
    "crates/shenko-store",
    "crates/shenko-broker",
    "crates/shenko-subject",
    "crates/shenko-memory",
    "crates/shenko-channel-napcat",
    "crates/shenko-exec-host",
    "crates/shenko-exec-ssh",
    "crates/shenko-wasm",
    "crates/shenko-compact-budget",
    "crates/shenko-compact-snap",
    "crates/shenko-awareness-core",
    "crates/shenko-ui",
    "crates/shenko-seed",
    "bin/shenko",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Shenko Contributors"]
license = "Apache-2.0"
repository = "https://github.com/cyjin-yl/shenko"
rust-version = "1.82"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Plugin backbone (user-confirmed: cordis-rs)
cordis-core = { git = "https://github.com/dshbox/cordis-rs", rev = "1754062cef67cfc119fc7a2084c0321a231b9092" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "hooks", "functions"] }
rusqlite_migration = "1.3"
blake3 = "1"

# IDs and hashing
uuid = { version = "1", features = ["v4", "serde"] }
ulid = { version = "1", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP / WebSocket (UI server)
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio-tungstenite = "0.26"
hyper = { version = "1", features = ["full"] }

# WASM runtime
wasmtime = { version = "45", features = ["component-model", "async", "cache"] }
wasmtime-wasi = { version = "45", features = ["tokio"] }
wit-component = "0.221"

# SSH
russh = "0.47"
russh-keys = "0.47"

# Crypto
ring = "0.17"
base64 = "0.22"
hex = "0.4"

# Concurrency / channels
crossbeam = "0.8"
dashmap = "5"
parking_lot = "0.12"

# Misc
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
regex = "1"
once_cell = "1"
smallvec = { version = "1", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
