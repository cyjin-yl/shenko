[package]
name = "shenko-exec-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
shenko-exec-ssh = { path = "../shenko-exec-ssh" }
shenko-types = { path = "../shenko-types" }
shenko-store = { path = "../shenko-store" }
shenko-subject = { path = "../shenko-subject" }
shenko-memory = { path = "../shenko-memory" }
shenko-awareness-core = { path = "../shenko-awareness-core" }
shenko-node = { path = "../shenko-node" }
shenko-wasm = { path = "../shenko-wasm" }
shenko-channel-napcat = { path = "../shenko-channel-napcat" }
shenko-broker = { path = "../shenko-broker" }
shenko-kernel = { path = "../shenko-kernel" }
shenko-identity = { path = "../shenko-identity" }
shenko-document = { path = "../shenko-document" }
shenko-context-policy = { path = "../shenko-context-policy", features = ["store"] }
cordis-core.workspace = true
blake3 = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
png = { workspace = true }
x11rb = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
rusqlite = { workspace = true }
# The self-learning proof consumer reads a stopped installation the way the
# launcher resolves it (durable slot pointer) and records its own binary's
# sha256 as declared source binding. Both are consumer-only, dev-only needs.
shenko-update = { path = "../shenko-update" }
sha2 = { workspace = true }

# The self-learning proof consumer takes its own `--binary`/`--repo` and runs
# exactly once per invocation, so it is a plain binary rather than a libtest
# target that would reject those arguments.
[[test]]
name = "cognition_self_learning"
harness = false

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
[lints.rust]
edition_2024_expr_fragment_specifier = "allow"
