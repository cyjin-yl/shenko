[package]
name = "shenko-subject"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
cordis-core.workspace = true
shenko-identity = { path = "../shenko-identity" }
shenko-types = { path = "../shenko-types" }
shenko-kernel = { path = "../shenko-kernel" }
shenko-store = { path = "../shenko-store" }
shenko-broker = { path = "../shenko-broker" }
shenko-quota = { path = "../shenko-quota" }
shenko-context-policy = { path = "../shenko-context-policy", features = ["store"] }
shenko-awareness-core = { path = "../shenko-awareness-core" }
# The pluggable memory-intervention policy and its contribution producer.
shenko-memory = { path = "../shenko-memory" }
# Forgetting plugin: six ordered projection stages, active-runtime measurement.
shenko-forgetting = { path = "../shenko-forgetting" }
blake3 = { workspace = true }
# The frozen step input carries inference parts with shared image bytes.
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true }
# Account-scoped quota reads (SPEC §42.2) fetch management documents over
# the provider's own API. The same dependency and features the broker uses,
# so the lock file keeps one HTTP stack.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
[dev-dependencies]
shenko-kernel = { path = "../shenko-kernel" }
shenko-compact-budget = { path = "../shenko-compact-budget" }
shenko-channel-napcat = { path = "../shenko-channel-napcat" }
shenko-node = { path = "../shenko-node" }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
[lints.rust]
edition_2024_expr_fragment_specifier = "allow"
