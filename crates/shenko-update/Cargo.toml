[package]
name = "shenko-update"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
shenko-types = { path = "../shenko-types" }
shenko-store = { path = "../shenko-store" }
shenko-subject = { path = "../shenko-subject" }
rusqlite = { workspace = true, features = ["backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
# `JobObjects`/`Threading`/`Diagnostics_ToolHelp` own and start the smoke's
# candidate tree; `Foundation` closes those handles and `Security` is named by
# `CreateJobObjectW`'s attribute pointer, which is null here.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints.rust]
edition_2024_expr_fragment_specifier = "allow"
