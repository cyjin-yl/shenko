[package]
name = "shenko-ssh-wasi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A guest has its own dependency features: enabling the host workspace's
# multithreaded Tokio runtime would misrepresent the WASI target.
[workspace]

[dependencies]
anyhow = "=1.0.104"
russh = { version = "=0.65.0", default-features = false, features = ["ring"] }
tokio = { version = "=1.54.1", features = ["rt", "time", "io-util", "sync", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rand = "=0.10.3"

[patch.crates-io]
russh = { path = "../../../../third-party/russh-duplex" }
russh-util = { path = "runtime-support" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
