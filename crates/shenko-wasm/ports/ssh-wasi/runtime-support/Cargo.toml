[package]
name = "russh-util"
version = "0.52.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Source-bound russh runtime selection for WASI preview1"

[dependencies]
tokio = { version = "1.17.0", features = ["sync", "macros", "rt"] }

[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
chrono = "0.4.38"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.43"
