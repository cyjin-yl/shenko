[package]
name = "shenko-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
shenko-types = { path = "../shenko-types" }
shenko-node = { path = "../shenko-node" }
shenko-store = { path = "../shenko-store" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
# Shenko-owned preview1 host boundary (docs/specs/wasm-home.md#spec-8-3/A08): the WITX interface is
# generated with wiggle, and every guest filesystem resolution proceeds from
# cap-std directory capabilities instead of a re-resolved host pathname.
cap-std = "3.4.6"
wiggle = "45"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wat = "1"
base64 = { workspace = true }

[lints.rust]
edition_2024_expr_fragment_specifier = "allow"
