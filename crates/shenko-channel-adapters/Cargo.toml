[package]
name = "shenko-channel-adapters"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Official QQ, iLinkBot and Feishu/Lark channel adapters for the Shenko IM boundary (SPEC §15.3, §16, §35.6)"

[dependencies]
shenko-types = { path = "../shenko-types" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
sha1 = "0.10"
md5 = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }

[lints.rust]
edition_2024_expr_fragment_specifier = "allow"
