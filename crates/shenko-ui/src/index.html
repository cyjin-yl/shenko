<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shenko（深刻）</title>
<style>
:root{--bg:#0f0f0f;--surface:#1a1a1a;--border:#2a2a2a;--text:#e8e8e8;--muted:#888;--accent:oklch(70% 0.18 250);--accent-dim:oklch(45% 0.14 250)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;height:100dvh;display:flex;flex-direction:column}
header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
header h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent-dim)}
.dot.on{background:var(--accent)}
main{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:680px;padding:12px 16px;border-radius:12px;line-height:1.65}
.msg.subject{background:var(--surface);border:1px solid var(--border)}
.msg.user{background:var(--accent-dim);margin-left:auto}
footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px}
textarea{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 14px;font-size:14px;resize:none;height:44px}
textarea:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);border:none;border-radius:8px;color:#000;padding:0 18px;font-size:14px;font-weight:600;cursor:pointer;height:44px}
</style>
</head>
<body>
<header><div class="dot" id="dot"></div><h1>Shenko（深刻）</h1></header>
<main id="tl"></main>
<footer>
<textarea id="inp" placeholder="发消息…"></textarea>
<button id="btn">发送</button>
</footer>
<script>
const tl=document.getElementById('tl'),inp=document.getElementById('inp'),dot=document.getElementById('dot');
let ws;
function connect(){const p=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(p+'//'+location.host+'/ws');ws.onopen=()=>dot.classList.add('on');ws.onclose=()=>{dot.classList.remove('on');setTimeout(connect,3000)};ws.onmessage=e=>{const m=JSON.parse(e.data);add(m.role||'subject',m.content||'')}}
function add(role,content){const d=document.createElement('div');d.className='msg '+role;d.textContent=content;tl.appendChild(d);tl.scrollTop=tl.scrollHeight}
document.getElementById('btn').addEventListener('click',()=>{const t=inp.value.trim();if(!t)return;add('user',t);if(ws&&ws.readyState===1)ws.send(JSON.stringify({role:'user',content:t}));inp.value=''});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('btn').click()}});
connect();
</script>
</body>
</html>
