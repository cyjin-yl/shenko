<!DOCTYPE html>
<html lang="zh" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15171f">
  <meta name="description" content="Shenko Web 界面">
  <title>Shenko</title>
  <!-- The theme is decided BEFORE the first paint: a reader who prefers the
       light scheme must not see a dark frame flash by. The rules are the
       shell's own (query, stored choice, then the system preference), so the
       bootstrap and the controller agree on the first frame. -->
  <script>
    (function () {
      try {
        var query = new URLSearchParams(location.search).get('theme');
        var stored = null;
        try { stored = localStorage.getItem('shenko.theme.v1'); } catch (error) { stored = null; }
        var theme = query === 'light' || query === 'dark'
          ? query
          : (stored === 'light' || stored === 'dark' ? stored : null);
        if (theme === null) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle('light', theme === 'light');
        root.classList.toggle('dark', theme === 'dark');
      } catch (error) {
        /* A browser that refuses the storage keeps the default theme. */
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets/proto-ui-style.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">Shenko 的正式界面需要启用 JavaScript。数据与恢复接口仍可由同一 Rust 服务访问。</p></noscript>
</body>
</html>
